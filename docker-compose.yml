version: '3.7'

services:
  streamlit-app:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    image: mynsun/streamlitapp:latest
    container_name: streamlitapp
    ports:
      - "8501:8501"

    env_file:
      - ./.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

    restart: always

  fastapi-service:
    build:
      context: ./fastapi_service 
      dockerfile: Dockerfile
    image: mynsun/fastapi-backend:latest
    container_name: fastapi-backend
    ports:
      - "3000:3000"

    env_file:
      - ./.env 
    environment:
    restart: always
