<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식단 관리 | 건강 한 끼</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0eafc 100%);
            margin: 0;
            line-height: 1.6;
            /* 가독성을 위해 추가 */
            color: #333;
            /* 기본 글자색 설정 */
        }

        /* 헤더 전체 스타일 (상단 바) */
        header {
            background: #fff;
            box-shadow: 0 2px 12px rgba(44, 62, 80, 0.06);
            /* margin: 0 auto; 와 text-align: center; 는 .container에 의해 처리되므로 제거 */
            width: 100%;
            /* 헤더는 항상 전체 너비 */
        }

        /* 헤더 내부 콘텐츠를 담는 컨테이너 */
        .header-content-wrapper {
            /* .container 대신 더 명확한 이름 사용 */
            max-width: 1200px;
            /* 콘텐츠 최대 너비 */
            margin: 0 auto;
            /* 가운데 정렬의 핵심 */
            display: flex;
            /* Flexbox 활성화 */
            align-items: center;
            /* 수직 가운데 정렬 (로고와 네비게이션) */
            justify-content: space-between;
            /* 로고와 네비게이션을 양 끝으로 벌림 */
            padding: 18px 24px;
            /* 좌우 여백 추가 */
            box-sizing: border-box;
            /* 패딩이 너비에 포함되도록 */
        }

        /* 로고 영역 */
        .logo-area {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 70px;
            width: 70px;
            margin-right: 13px;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #080707;
            letter-spacing: -1px;
            margin: 0;
            /* h1 기본 마진 제거 */
        }

        /* 네비게이션 메뉴 */
        nav ul {
            display: flex;
            list-style: none;
            gap: 22px;
            /* 메뉴 아이템 간 간격 */
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #34495e;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
            /* 메뉴 텍스트가 줄바꿈되지 않도록 */
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #4CAF50;
            background-color: rgba(76, 175, 80, 0.1);
            /* 호버 시 배경색 추가 */
        }

        /* 기존 .container 스타일은 더 이상 헤더의 주 컨테이너가 아니므로 삭제하거나 다른 용도로 사용 */
        /* 이전에 .container에 설정된 padding: 0 24px; text-align: center; 등은 이제 .header-content-wrapper에서 관리 */
        .container {
            /* 다른 섹션에 있는 .container는 그대로 유지 */
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            /* text-align: center; (필요에 따라 유지 또는 제거) */
        }

        /* 환영 메시지 스타일 */
        #welcomeArea {
            display: none;
            margin: 40px auto 22px auto;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.10);
            padding: 32px 18px 28px 18px;
            text-align: center;
            position: relative;
            animation: fadeIn 1s cubic-bezier(.4, 0, .2, 1);
        }

        #welcomeArea .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
        }

        #welcomeArea .username {
            font-size: 2rem;
            font-weight: 700;
            color: #2a7ae2;
            margin-bottom: 8px;
            display: block;
        }

        #welcomeArea .subtitle {
            font-size: 1.1rem;
            color: #7b8a99;
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 18px;
        }

        .hero iframe {
            margin-top: 12px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.10);
            background: #fff;
            width: 80%;
            /* 기존 값 유지 */
            height: 500px;
            /* 기존 값 유지 */
            min-width: 300px;
            /* 최소 너비 설정 (모바일 대응) */
        }

        /* Features 섹션 스타일 (기존 .container 활용) */
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 40px;
            margin-top: 60px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 60px;
            /* 하단 여백 추가 */
        }

        .feature-item {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(44, 62, 80, 0.08);
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 48px rgba(44, 62, 80, 0.12);
        }

        .feature-item .icon {
            font-size: 3.5rem;
            color: #4CAF50;
            margin-bottom: 18px;
        }

        .feature-item h3 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        .feature-item p {
            font-size: 1rem;
            color: #616a72;
            line-height: 1.7;
        }

        /* 푸터 스타일 */
        footer {
            background-color: #34495e;
            color: #ecf0f1;
            padding: 30px 0;
            text-align: center;
            font-size: 0.9rem;
        }

        footer .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .footer-links a {
            color: #7f8c8d;
            text-decoration: none;
            margin: 0 8px;
        }

        .footer-links a:hover {
            color: #ecf0f1;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .header-content-wrapper {
                flex-direction: column;
                /* 모바일에서 로고와 네비게이션을 세로로 정렬 */
                padding: 15px 15px;
                /* 모바일 패딩 조정 */
            }

            nav ul {
                margin-top: 15px;
                /* 로고와 메뉴 사이 간격 */
                gap: 15px;
                /* 메뉴 아이템 간격 조정 */
                flex-wrap: wrap;
                /* 메뉴가 많으면 다음 줄로 넘어갈 수 있도록 */
                justify-content: center;
                /* 메뉴 아이템 가운데 정렬 */
            }

            .logo-img {
                height: 36px;
                /* 모바일 로고 크기 조정 */
            }

            .brand-name {
                font-size: 1.3rem;
                /* 모바일 브랜드명 크기 조정 */
            }

            .section-title {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
                /* 모바일에서 한 줄에 하나씩 */
            }

            .feature-item {
                padding: 25px;
            }

            #welcomeArea {
                font-size: 1rem;
                padding: 18px 4px;
            }
        }

        @media (max-width: 480px) {
            nav ul li a {
                padding: 7px 10px;
                /* 더 작은 화면에서 메뉴 패딩 조정 */
            }

            .hero iframe {
                width: 95vw;
                /* 더 작은 화면에서 아이프레임 너비 조정 */
                min-width: unset;
            }
        }
    </style>
</head>

<body id="streamlitbox">
    <header>
        <div class="header-content-wrapper">
            <a href="index.html" class="logo-area">
                <img src="logo.png" alt="로고" class="logo-img">
                <h1 class="brand-name">사이트 이름</h1>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="index.html#features">주요 기능</a></li>
                    <li><a href="food_diary.html">식단 관리</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <div class="main-content container">
        <iframe src="http://13.124.198.232:8501/" width="190%" height="300"
            style="border: none; border-radius: 16px;"></iframe>
    </div>
</body>

</html>
