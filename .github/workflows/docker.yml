name: Docker Build, Push & Deploy

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_IMAGE_NAME: mynsunxx/streamlitapp
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}
  EC2_PORT: ${{ secrets.PORT }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Deploy to EC2 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_KEY }}
          port: ${{ env.EC2_PORT }}
          script: |
            echo "--- Pulling Latest App Image ---"
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:latest
            echo "--- Stopping and Removing Old App Container ---"
            docker stop streamlit_app || true
            docker rm streamlit_app || true
            echo "--- Running New App Container ---"
            docker run -d --restart always --name streamlit_app -p 8501:8501 ${{ env.DOCKER_IMAGE_NAME }}:latest
            echo "--- Cleaning up unused Docker images ---"
            docker system prune -f
