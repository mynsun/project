name: Docker Build, Push & Deploy

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
  STREAMLIT_IMAGE_NAME: mynsunxx/streamlitapp
  FASTAPI_IMAGE_NAME: mynsunxx/fastapi-backend
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}
  EC2_PORT: ${{ secrets.PORT }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Streamlit Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.STREAMLIT_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push FastAPI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi_service
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.FASTAPI_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_KEY }}
          port: ${{ env.EC2_PORT }}
          envs: OPENAI_API_KEY
          script: |
            echo "--- Navigating to project directory on EC2 ---"

            echo "--- Pulling Latest Streamlit & FastAPI App Images ---"
            docker pull ${{ env.STREAMLIT_IMAGE_NAME }}:latest
            docker pull ${{ env.FASTAPI_IMAGE_NAME }}:latest

            echo "--- Stopping and Recreating Docker Compose Services ---"

            docker-compose down
            docker-compose up -d --force-recreate

            echo "--- Cleaning up unused Docker images ---"
            docker system prune -f

            echo "Deployment complete!"
