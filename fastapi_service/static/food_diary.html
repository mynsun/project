<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식단 관리 | 건강 한 끼</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0eafc 100%);
            margin: 0;
            line-height: 1.6;
            color: #333;
        }

        header {
            background: #fff;
            box-shadow: 0 2px 12px rgba(44, 62, 80, 0.06);
            width: 100%;
        }

        .header-content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            box-sizing: border-box;
        }

        .logo-area {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 70px;
            width: 70px;
            margin-right: 13px;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #080707;
            letter-spacing: -1px;
            margin: 0;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 22px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #34495e;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #4CAF50;
            background-color: rgba(76, 175, 80, 0.1);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        #welcomeArea {
            display: none;
            margin: 40px auto 22px auto;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.10);
            padding: 32px 18px 28px 18px;
            text-align: center;
            position: relative;
            animation: fadeIn 1s cubic-bezier(.4, 0, .2, 1);
        }

        #welcomeArea .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
        }

        #welcomeArea .username {
            font-size: 2rem;
            font-weight: 700;
            color: #2a7ae2;
            margin-bottom: 8px;
            display: block;
        }

        #welcomeArea .subtitle {
            font-size: 1.1rem;
            color: #7b8a99;
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 18px;
        }

        .hero iframe {
            margin-top: 12px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.10);
            background: #fff;
            width: 80%;
            height: 500px;
            min-width: 300px;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 40px;
            margin-top: 60px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 60px;
        }

        .feature-item {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(44, 62, 80, 0.08);
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 48px rgba(44, 62, 80, 0.12);
        }

        .feature-item .icon {
            font-size: 3.5rem;
            color: #4CAF50;
            margin-bottom: 18px;
        }

        .feature-item h3 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        .feature-item p {
            font-size: 1rem;
            color: #616a72;
            line-height: 1.7;
        }

        footer {
            background-color: #34495e;
            color: #ecf0f1;
            padding: 30px 0;
            text-align: center;
            font-size: 0.9rem;
        }

        footer .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .footer-links a {
            color: #7f8c8d;
            text-decoration: none;
            margin: 0 8px;
        }

        .footer-links a:hover {
            color: #ecf0f1;
        }

        @media (max-width: 768px) {
            .header-content-wrapper {
                flex-direction: column;
                padding: 15px 15px;
            }

            nav ul {
                margin-top: 15px;
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .logo-img {
                height: 36px;
            }

            .brand-name {
                font-size: 1.3rem;
            }

            .section-title {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .feature-item {
                padding: 25px;
            }

            #welcomeArea {
                font-size: 1rem;
                padding: 18px 4px;
            }
        }

        @media (max-width: 480px) {
            nav ul li a {
                padding: 7px 10px;
            }

            .hero iframe {
                width: 95vw;
                min-width: unset;
            }
        }
    </style>
</head>

<body id="streamlitbox">
    <header>
        <div class="header-content-wrapper">
            <a href="/" class="logo-area">
                <img src="logo.png" alt="로고" class="logo-img">
                <h1 class="brand-name">사이트 이름</h1>
            </a>
            <nav>
                <ul>
                    <li><a href="/">홈</a></li>
                    <li><a href="/#features">주요 기능</a></li>
                    <li><a href="/food_diary">식단 관리</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <div class="main-content container">
        <iframe src="http://13.124.198.232:8501/" width="190%" height="300"
            style="border: none; border-radius: 16px;"></iframe>
    </div>
</body>

</html>
