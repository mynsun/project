<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>로그인/회원가입 | 건강 한 끼</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-form {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0eafc 100%);
            margin: 0;
        }

        header {
            background: #fff;
            box-shadow: 0 2px 12px rgba(44, 62, 80, 0.06);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 42px;
            margin-right: 13px;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4CAF50;
            letter-spacing: -1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 22px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #34495e;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #4CAF50;
        }

        /* 환영 메시지 스타일 */
        #welcomeArea {
            display: none;
            margin: 40px auto 22px auto;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.10);
            padding: 32px 18px 28px 18px;
            text-align: center;
            position: relative;
            animation: fadeIn 1s cubic-bezier(.4, 0, .2, 1);
        }

        #welcomeArea .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
        }

        #welcomeArea .username {
            font-size: 2rem;
            font-weight: 700;
            color: #2a7ae2;
            margin-bottom: 8px;
            display: block;
        }

        #welcomeArea .subtitle {
            font-size: 1.1rem;
            color: #7b8a99;
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 18px;
        }

        .hero iframe {
            margin-top: 12px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.10);
            background: #fff;
        }

        @media (max-width: 700px) {
            .container {
                padding: 0 8px;
            }

            .hero iframe {
                width: 98vw;
                min-width: 0;
            }

            #welcomeArea {
                font-size: 1rem;
                padding: 18px 4px;
            }

            .logo-img {
                height: 28px;
            }

            .brand-name {
                font-size: 1.05rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container"
            style="display: flex; align-items: center; justify-content: space-between; padding: 18px 0;">
            <a href="index.html" class="logo-area">
                <img src="logo.png" alt="로고" class="logo-img">
                <h1 class="brand-name">사이트 이름</h1>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="index.html#features">주요 기능</a></li>
                    <li><a href="food_diary.html">식단 관리</a></li>
                    <li><a href="login.html">로그인 / 회원가입</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="login-container" style="margin-top: 60px;">
        <div class="login-form">
            <iframe src="http://13.124.198.232:8502/" width="100%" height="600"
                style="border: none; border-radius: 16px;"></iframe>
        </div>
    </div>

    <script>
        // 로그인 성공 메시지 수신 시 index.html로 리다이렉트
        window.addEventListener("message", function (event) {
            // 로그인 성공 메시지 예시: {type: "login", username: "홍길동"}
            if (event.data && (event.data.type === "login" || event.data.type === "loginSuccess") && event.data.username) {
                sessionStorage.setItem('username', event.data.username);
                window.location.href = "index.html";
            }
        });
    </script>
</body>

</html>
