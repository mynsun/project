<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo-area">
                <img src="logo.png" alt="로고" class="logo-img">
                <h1 class="brand-name">사이트 이름</h1>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="index.html#features">주요 기능</a></li>

            </nav>
        </div>
    </header>

    <div class="container" style="margin-top: 60px;">
        <div class="login-form">
            <h2>로그인</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="cta-button">로그인</button>
            </form>
            <p class="signup-link">아직 회원이 아니신가요? <a href="#signup">회원가입</a></p>
        </div>
    </div>
</body>

</html>
